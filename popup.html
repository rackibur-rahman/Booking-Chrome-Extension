<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Booking</title>
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #0b7247;
      font-size: 15px;
      text-align: center;
    }

    h4 {
      margin: 0 0 10px 0;
      color: #dd3d24;           /* Red color */
      font-size: 11px;           /* ছোট font */
      text-align: center;        /* Center aligned */
      font-weight: normal;       /* Bold নয় */
      background: transparent;   /* কোনো background নেই */
      letter-spacing: 0.5px;     /* হালকা letter spacing */
    }

    .field {
      margin-bottom: 6px;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      display: block;
      color: #333;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 2px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    input:focus {
      border-color: #0b7247;
      outline: none;
    }
    .btn-row {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    #saveBtn { background-color: #e9ecef; color: #333; }
    #runBtn { background-color: #0b7247; color: #fff; }
    #stopBtn { background-color: #dc3545; color: #fff; }
  </style>
</head>
<body>
  <h3>BD Railway Auto Booking</h3>
    <h4>Powered by Tawoos</h4>

  <div class="field">
    <label>From:</label>
    <input type="text" id="fromStation" placeholder="Dhaka" />
  </div>

  <div class="field">
    <label>To:</label>
    <input type="text" id="toStation" placeholder="Rajshahi" />
  </div>

  <div class="field">
    <label>Date of Journey:</label>
    <input type="date" id="journeyDate" />
  </div>

  <div class="field">
    <label>Choose Class:</label>
    <input type="text" id="travelClass" placeholder="S_CHAIR / SNIGDHA / AC_S" />
  </div>

  <div class="field">
    <label>Train Name:</label>
    <input type="text" id="trainName" placeholder="DHUMKETU / PADMA" />
  </div>

  <!-- <div class="field">
    <label>Coach Name:</label>
    <input type="text" id="coachName" placeholder="KA / JHA / TA" />
  </div> -->

  <div class="field">
    <label>Seats Count (Max 4):</label>
    <input type="number" id="seatCount" min="1" max="4" value="1" />
  </div>

  <div class="btn-row">
    <button id="saveBtn">Save</button>
    <button id="runBtn">Run Automation</button>
    <button id="stopBtn">Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
